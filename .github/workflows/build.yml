name: Build SpectreCore
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - run: python3 -m pip install pyyaml
      - run: python3 tests/validate_release.py
      - run: python3 tests/validate_always_on_modules.py
      - run: python3 tests/validate_native_missions.py
      - run: python3 tests/validate_native_armors.py
      - run: python3 tests/validate_relicario_catalog.py
      - run: python3 tests/validate_native_cooking.py
      - run: python3 tests/validate_native_jobs.py
      - run: python3 tests/validate_supply_board.py
      - run: python3 tests/validate_presentation.py
      - run: python3 tests/validate_player_presentation_policy.py
      - run: python3 tests/validate_mago_models.py
      - run: python3 tests/validate_native_mago.py
      - run: python3 tests/validate_m3_security.py
      - run: bash tests/run_pure_java_tests.sh
      - run: bash tests/check_java_syntax.sh
      - run: gradle clean build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SpectreCore-0.9.0-dev2
          path: build/libs/SpectreCore-0.9.0-dev2.jar
          if-no-files-found: error
