      menu_message: "\n&8✦ &6ᴅᴇsᴄᴜʙʀɪᴍɪᴇɴᴛᴏ ᴅᴇʟ ᴍɪᴛʀɪʟᴏ &8· &7Mitrilo y picos de Mitrilo"
      chat_message: "\n&6✦ &fᴍɪɴᴇʀíᴀ 18 &8│ &eᴅᴇsᴄᴜʙʀɪᴍɪᴇɴᴛᴏ ᴅᴇʟ ᴍɪᴛʀɪʟᴏ &8· &fBusca Mitrilo y forja un pico capaz de marcar vetas"
  22:
