      value: true
      menu_message: "\n&8✦ &6ᴅᴜᴇɴᴅᴇs ᴅᴇʟ ᴏʀᴏ &8· &7Duendes del Oro y Chatarra Mecánica"
      chat_message: "\n&6✦ &fᴍɪɴᴇʀíᴀ 12 &8│ &eᴅᴜᴇɴᴅᴇs ᴅᴇʟ ᴏʀᴏ &8· &fMina oro natural: los Duendes dejan chatarra para reforzar el Taladro"
  15:
    - type: permission
      permission: hydev.mineria.resonancia
      value: true
      menu_message: "\n&8✦ &6ʀᴇsᴏɴᴀɴᴄɪᴀ ᴍɪɴᴇʀᴀʟ &8· &7Prospectores, Pico Perdido y contrato Profesional"
      chat_message: "\n&6✦ &fᴍɪɴᴇʀíᴀ 15 &8│ &eʀᴇsᴏɴᴀɴᴄɪᴀ ᴍɪɴᴇʀᴀʟ &8· &fMina diamante, esmeralda u obsidiana: busca Prospectores y fragmentos; contrata el rango Profesional"
  18:
