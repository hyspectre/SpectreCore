      menu_message: "\n&8✦ &6ɪɴɢᴇɴɪᴇʀíᴀ ʏ ᴘʀᴏsᴘᴇᴄᴄɪóɴ &8· &7Linterna y Barrena"
      chat_message: "\n&6✦ &fᴍɪɴᴇʀíᴀ 25 &8│ &eɪɴɢᴇɴɪᴇʀíᴀ ʏ ᴘʀᴏsᴘᴇᴄᴄɪóɴ &8· &fLinterna: revela menas; Barrena: excava roca"
