# Hydev / AuraSkills — recompensas de minería.
# Una sola fuente de verdad para niveles, estadísticas, permisos y anuncios.
# Nunca conceder permisos de contratos pagados desde aquí.
# Los mensajes se ven también en el menú nativo de progresión.
patterns:
  - type: stat
    stat: toughness
    value: 1
    pattern:
      interval: 1
  - type: stat
    stat: luck
    value: 1
    pattern:
      interval: 2

levels:
  1:
    - type: permission
      permission: hydev.mineria.inicial
      value: true
      menu_message: "\n&8✦ &6ᴍɪɴᴇʀíᴀ ɪɴɪᴄɪᴀʟ &8· &7Contrato Novato y encargos"
      chat_message: "\n&6✦ &fᴍɪɴᴇʀíᴀ 1 &8│ &eᴍɪɴᴇʀíᴀ ɪɴɪᴄɪᴀʟ &8· &fContrata el rango Novato y cumple encargos"
  3:
    - type: permission
      permission: hydev.mineria.hechizados
      value: true
      menu_message: "\n&8✦ &6ᴍɪɴᴇʀᴀʟᴜʀɢɪᴀ &8· &7Minerales hechizados y Taller Minero"
      chat_message: "\n&6✦ &fᴍɪɴᴇʀíᴀ 3 &8│ &eᴍɪɴᴇʀᴀʟᴜʀɢɪᴀ &8· &fVisita el Taller Minero: compacta recursos o pulveriza hechizados"
  6:
    - type: permission
      permission: hydev.mineria.paladio
      value: true
      menu_message: "\n&8✦ &6ʟᴀ ᴇʀᴀ ᴅᴇʟ ᴘᴀʟᴀᴅɪᴏ &8· &7Paladio, Taladro y contrato Experimentado"
      chat_message: "\n&6✦ &fᴍɪɴᴇʀíᴀ 6 &8│ &eʟᴀ ᴇʀᴀ ᴅᴇʟ ᴘᴀʟᴀᴅɪᴏ &8· &fBusca Paladio, fabrica el Taladro y contrata el rango Experimentado"
  10:
    - type: command
      executor: console
      command: "mi give CONSUMABLE MEJORA_ARMA1 {player} 1"
      menu_message: "\n&8✦ &6ᴄéɴɪᴛ &8· &7Recompensa: Cénit ×1"
      chat_message: "\n&6✦ &fᴍɪɴᴇʀíᴀ 10 &8│ &eᴄéɴɪᴛ &8· &fHito de mejora de armas"
  12:
    - type: permission
