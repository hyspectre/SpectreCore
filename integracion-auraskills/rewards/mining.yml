      chat_message: "\n&6✦ &fᴍɪɴᴇʀíᴀ 22 &8│ &eʀᴇsᴏɴᴀɴᴄɪᴀ ᴀʀᴄᴀɴᴀ &8· &fForja el Pico de Amatista: invoca cristales y extrae gemas; abre geodas"
