  base:
    revision-id: 8
    gem-sockets:
    - '1'
    material: NETHERITE_PICKAXE
    max-stack-size: 1
    name: '<gradient:#BC87FF:#F3D1FC>Pico de Amatista</gradient>'
    tier: LEGENDARY
    lore-format: herramienta-minera
    lore:
    - '&f'
    - '&f  <gradient:#BC87FF:#F3D1FC>ᴇsᴛᴀᴅísᴛɪᴄᴀs</gradient>'
    - '&f'
    - '&7 ᴄʀɪsᴛᴀʟᴇs &f3–5'
    - '&7 ɢᴏʟᴘᴇs ᴘᴏʀ ᴄʀɪsᴛᴀʟ &f3'
    - '&f'
    - '&f  <gradient:#BC87FF:#F3D1FC>ʜᴀʙɪʟɪᴅᴀᴅ</gradient> &fCristales'
    - '&f'
    - '&7 Invoca cristales que contienen gemas.'
    - '&7 ʀᴇsᴏɴᴀɴᴄɪᴀ &f45–75'
    - '&7 ᴅᴜʀᴀᴄɪóɴ &f30 s  &8·  &7ʀᴇᴄᴀʀɢᴀ &f120 s'
