# Fusionar estas entradas en plugins/MMOItems/item/TOOL.yml.
# Ambas usan el tipo MMOItems TOOL existente: no crear un tipo adicional.
PICO_MITRILO:
  base:
    revision-id: 7
    gem-sockets: ['1']
    material: DIAMOND_PICKAXE
    name: '<gradient:#6EBCCF:#D4F4E9>Pico de Mitrilo</gradient>'
    tier: RARE
    lore-format: herramienta-minera
    lore:
    - '&f  <gradient:#74B8B5:#D0B8E9>ᴇsᴛᴀᴅísᴛɪᴄᴀs</gradient>'
    - '&7 Hallazgo de Mitrilo: &a+25%'
    - '&7 Hallazgo de gemas: &f1%'
    - '&7 Menas adicionales: &fHasta 3'
    - '&7 Resonancia: &f25 + 5 por mena extra'
    - '&7 Duración: &f15 s &8│ &7Recarga: &f20 s'
    - '&f  <gradient:#FCD05C:#E43A96>ʜᴀʙɪʟɪᴅᴀᴅ</gradient> &fVeta'
    - '&e Agáchate + clic derecho sobre una mena.'
    - '&e Extrae la veta marcada.'

