# Fusionar estas entradas en plugins/MMOItems/item/TOOL.yml.
# Ambas usan el tipo MMOItems TOOL existente: no crear un tipo adicional.
PICO_MITRILO:
  base:
    revision-id: 2
    material: DIAMOND_PICKAXE
    name: '<gradient:#6EBCCF:#D4F4E9>Pico de Mitrilo</gradient>'
    tier: RARE
    lore:
    - '&f  <gradient:#FCD05C:#E43A96>ʜᴀʙɪʟɪᴅᴀᴅ</gradient> &fVeta'
    - '&f'
    - '&e ᴀɢáᴄʜᴀᴛᴇ ʏ ʜᴀᴢ ᴄʟɪᴄ ᴅᴇʀᴇᴄʜᴏ'
    - '&e sᴏʙʀᴇ ᴜɴᴀ ᴠᴇᴛᴀ. ᴀʟ ᴘɪᴄᴀʀʟᴀ,'
    - '&e ᴇxᴛʀᴀᴇs ʜᴀsᴛᴀ 3 ᴍᴇɴᴀs ᴍás.'
PICO_MITRILO_TEMPLADO:
  base:
    revision-id: 2
    material: NETHERITE_PICKAXE
    name: '<gradient:#A2ECDE:#F5E7BB>Pico de Mitrilo Templado</gradient>'
    tier: EPIC
    lore:
    - '&f  <gradient:#FCD05C:#E43A96>ʜᴀʙɪʟɪᴅᴀᴅ</gradient> &fVeta'
    - '&f'
    - '&e ᴀɢáᴄʜᴀᴛᴇ ʏ ʜᴀᴢ ᴄʟɪᴄ ᴅᴇʀᴇᴄʜᴏ'
    - '&e sᴏʙʀᴇ ᴜɴᴀ ᴠᴇᴛᴀ. ᴀʟ ᴘɪᴄᴀʀʟᴀ,'
    - '&e ᴇxᴛʀᴀᴇs ʜᴀsᴛᴀ 3 ᴍᴇɴᴀs ᴍás.'

# Controles: clic derecho; agacharse + clic derecho para los modos avanzados.
# La resonancia es del objeto, se conserva en su PDC y nunca se simula con lore.
# ID conservado para actualizar los faroles existentes sin perderlos.
FAROL_MITRILO:
  base:
    revision-id: 6
    material: SOUL_LANTERN
    max-stack-size: 1
    name: '<gradient:#8EDCCF:#BDA9E9>Linterna de Mitrilo</gradient>'
    tier: RARE
    permission:
    - hydev.mineria.ingenieria
    lore:
    - '&f  <gradient:#FCD05C:#E43A96>ʜᴀʙɪʟɪᴅᴀᴅ</gradient> &fLuz'
    - '&e Clic derecho: Visión nocturna (60 s).'
    - '&f  <gradient:#FCD05C:#E43A96>ʜᴀʙɪʟɪᴅᴀᴅ</gradient> &fPulso'
    - '&e Agáchate + clic derecho para revelar menas.'
    - '&7 Duración: &f3 s &8│ &7Recarga: &f140 s'

BARRENA_MITRILO:
  base:
    revision-id: 2
    material: NETHERITE_PICKAXE
    max-stack-size: 1
    name: '<gradient:#74B8CE:#E7E3BD>Barrena de Mitrilo</gradient>'
    tier: EPIC
    lore:
    - '&f  <gradient:#FCD05C:#E43A96>ʜᴀʙɪʟɪᴅᴀᴅ</gradient> &fTúnel'
    - '&f'
    - '&e ᴍɪʀᴀ ʜᴀᴄɪᴀ ᴅᴏɴᴅᴇ ᴠᴀs ᴀ ᴄᴀᴠᴀʀ.'
    - '&e ᴀɢáᴄʜᴀᴛᴇ ʏ ʜᴀᴢ ᴄʟɪᴄ ᴅᴇʀᴇᴄʜᴏ'
    - '&e ᴘᴀʀᴀ ᴀʙʀɪʀ ᴜɴ ᴛúɴᴇʟ ᴅᴇ 1 × 2.'

# Pico especial de resonancia minera: consume la misma energía persistente
# que el equipo de Mitrilo y crea cinco cristales golpeables, sin cambiar terreno.
PICO_AMATISTA:
  base:
    revision-id: 2
    material: NETHERITE_PICKAXE
    max-stack-size: 1
    name: '<gradient:#BC87FF:#F3D1FC>Pico de Amatista</gradient>'
    tier: LEGENDARY
    lore:
    - '&f  <gradient:#FCD05C:#E43A96>ʜᴀʙɪʟɪᴅᴀᴅ</gradient> &fCristales'
    - '&f'
    - '&e ᴀɢáᴄʜᴀᴛᴇ ʏ ʜᴀᴢ ᴄʟɪᴄ ᴅᴇʀᴇᴄʜᴏ.'
    - '&e ɢᴏʟᴘᴇᴀ ᴄᴀᴅᴀ ᴄʀɪsᴛᴀʟ 3 ᴠᴇᴄᴇs'
    - '&e ᴘᴀʀᴀ sᴀᴄᴀʀ ᴀᴍᴀᴛɪsᴛᴀ ʀᴇsᴏɴᴀɴᴛᴇ.'

