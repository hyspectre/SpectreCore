# Controles: clic derecho; agacharse + clic derecho para los modos avanzados.
# La resonancia es del objeto, se conserva en su PDC y nunca se simula con lore.
# ID conservado para actualizar los faroles existentes sin perderlos.
FAROL_MITRILO:
  base:
    revision-id: 7
    gem-sockets: ['1']
    material: SOUL_LANTERN
    max-stack-size: 1
    name: '<gradient:#8EDCCF:#BDA9E9>Linterna de Mitrilo</gradient>'
    tier: RARE
    permission:
    - hydev.mineria.ingenieria
    lore-format: herramienta-minera
    lore:
    - '&f  <gradient:#74B8B5:#D0B8E9>ᴇsᴛᴀᴅísᴛɪᴄᴀs</gradient>'
    - '&7 Visión nocturna: &f60 s'
    - '&7 Alcance: &f10 bloques'
    - '&7 Menas reveladas: &fHasta 24'
    - '&7 Duración: &f3 s &8│ &7Recarga: &f140 s'
    - '&f  <gradient:#FCD05C:#E43A96>ʜᴀʙɪʟɪᴅᴀᴅ</gradient> &fLuz y pulso'
    - '&e Clic derecho: ilumina tu visión.'
    - '&e Agáchate + clic derecho: revela menas.'

