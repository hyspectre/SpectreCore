# Controles: clic derecho; agacharse + clic derecho para los modos avanzados.
# La resonancia es del objeto, se conserva en su PDC y nunca se simula con lore.
# ID conservado para actualizar los faroles existentes sin perderlos.
FAROL_MITRILO:
  base:
    revision-id: 8
    gem-sockets:
    - '1'
    material: SOUL_LANTERN
    max-stack-size: 1
    name: '<gradient:#8EDCCF:#BDA9E9>Linterna de Mitrilo</gradient>'
    tier: RARE
    permission:
    - hydev.mineria.ingenieria
    lore-format: herramienta-minera
    lore:
    - '&f'
    - '&f  <gradient:#8EDCCF:#BDA9E9>ᴇsᴛᴀᴅísᴛɪᴄᴀs</gradient>'
    - '&f'
    - '&7 ᴠɪsɪóɴ ɴᴏᴄᴛᴜʀɴᴀ &f60 s'
    - '&7 ᴀʟᴄᴀɴᴄᴇ ᴅᴇʟ ᴘᴜʟsᴏ &f10 bloques'
    - '&7 ᴍᴇɴᴀs ʀᴇᴠᴇʟᴀᴅᴀs &fHasta 24'
    - '&7 ᴅᴜʀᴀᴄɪóɴ &f3 s  &8·  &7ʀᴇᴄᴀʀɢᴀ &f140 s'
    - '&f'
    - '&f  <gradient:#8EDCCF:#BDA9E9>ʜᴀʙɪʟɪᴅᴀᴅ</gradient> &fLuz y pulso'
    - '&f'
    - '&7 Ilumina tu visión con clic derecho.'
    - '&7 Agáchate y usa clic derecho'
    - '&7 para revelar menas cercanas.'
    - '&f'

