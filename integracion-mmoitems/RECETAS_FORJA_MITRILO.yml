# SOLO FRAGMENTO: añadir estas entradas bajo 'recipes:' en la estación
# MMOItems que ya abre el NPC Forja. No instalar este archivo como estación
# independiente: el ID/ruta de la estación real no está en este repositorio.
recipes:
  pico-mitrilo:
    output: 'mmoitems{type=TOOL,id=PICO_MITRILO}'
    crafting-time: 10
    ingredients:
    - 'mmoitem{type=MATERIAL,id=MITRILO,amount=12}'
    - 'vanilla{type=STICK,amount=2}'
    - 'vanilla{type=IRON_INGOT,amount=6}'
  pico-mitrilo-templado:
    output: 'mmoitems{type=TOOL,id=PICO_MITRILO_TEMPLADO}'
    crafting-time: 25
    ingredients:
    - 'mmoitem{type=MATERIAL,id=MITRILO,amount=24}'
    - 'mmoitem{type=TOOL,id=PICO_MITRILO,amount=1}'
    - 'vanilla{type=DIAMOND,amount=8}'
