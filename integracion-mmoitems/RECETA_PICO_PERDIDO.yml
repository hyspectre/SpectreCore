# REEMPLAZAR la receta existente con ID picoperdido en la Forja.
# NO generar otro pico: conserva el objeto original TOOL:PICO_GEMAS.
# La receta previa costaba 128 Paladio y un Sello del Minotauro;
# ahora el jugador debe derrotar Prospectores y reunir fragmentos.
recipes:
  picoperdido:
    output: 'mmoitems{type=TOOL,id=PICO_GEMAS}'
    crafting-time: 35
    ingredients:
    - 'mmoitem{type=MATERIAL,id=FRAGMENTO_PICO_PERDIDO,amount=4}'
    - 'mmoitem{type=MATERIAL,id=PALADIO,amount=24}'
    - 'mmoitem{type=MATERIAL,id=ORO,amount=2}'
    - 'mmoitem{type=MATERIAL,id=DIAMANTE,amount=2}'
