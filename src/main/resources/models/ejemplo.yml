    material: PLAYER_HEAD
    base64: ''
    offset: [0.0, 0.25, 0.0]
    rotation: [0, 0, 0]
    scale: [0.45, 0.45, 0.45]
    animation:
      mode: BOB
      amplitude: 0.10
      period-ticks: 40
  - type: TEXT_DISPLAY
    text: "<gold>✦ Ejemplo de Display Entities</gold>"
    offset: [0.0, 1.0, 0.0]
    scale: [0.5, 0.5, 0.5]
