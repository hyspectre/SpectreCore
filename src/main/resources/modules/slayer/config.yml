# SpectreCore: configura este sistema dentro de su módulo.
objetivos:
  tier1: 20
  tier2: 50
  tier3: 90
categorias:
  revenant:
    nombre: Monarquía Renacida
    entidad: ZOMBIE
    mob: ReyZombie{tier}
  necromancer:
    nombre: Nigromante
    entidad: SKELETON
    mob: Nigromante{tier}
  spider:
    nombre: Madre Araña
    entidad: SPIDER
    mob: MadreArana{tier}

avisos:
  cada-bajas: 10
invocacion:
  reintento-milisegundos: 5000
  nivel-mob: 1

# Contratos desde la interfaz nativa de SpectreCore.
# Activados por defecto en NUEVAS instalaciones de 0.7.4; requieren el nuevo JAR.
# Antes de desplegar, retirar accesos/cobros antiguos de zMenu y respaldar el servidor.
# Los precios de Revenant replican el menú Hordas; otros rangos quedan sin precio,
# así que se rechazan hasta configurarse explícitamente.
acceso-remoto:
  habilitado: true
  precio: 500
  tipo: MATERIAL
  id: TELEFONO1

contratos:
  habilitados: true
  precios:
    revenant:
      tier1: 200
      tier2: 500
      tier3: 950
  cancelacion:
    revenant: 200
