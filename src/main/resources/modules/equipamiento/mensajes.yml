  mensaje-005: Hydev
  mensaje-006: ''
  mensaje-007: 'Efectos del núcleo:'
  mensaje-008: DESACTIVADOS
  mensaje-009: ({piezas}) +{vida} HP.
  mensaje-010: (4) Resistencia al empuje +{valor1}.
  mensaje-011: ({piezas}) +{velocidad}% velocidad.
  mensaje-012: ({piezas}) +{vida} HP y +{velocidad}% velocidad.
  mensaje-013: (4) +{valor1} daño cuerpo a cuerpo; {valor2} menos daño recibido.
  mensaje-014: Sin bonos parciales del núcleo.
  mensaje-015: (4) {e-ability}.
  mensaje-016: 'Con Juramento Profanado: Blink confirmado crea un eco; próximo golpe +{valor1} durante {valor2}. Requiere
    habilidad activa.'
  mensaje-017: 'Con Dracoreliquia: +{valor1} s de bendición mientras la empuñas.'
  mensaje-018: ''
  mensaje-019: 'Bonos MMOItems:'
  mensaje-020: No se encontró el conjunto. Revisar su configuración.
  mensaje-021: Sin bonos extra.
  mensaje-022: ({count} piezas)
  mensaje-023: 'Habilidad extra de MMOItems: {valor1}.'
  mensaje-024: '{valor1}: {level-get-key}'
  mensaje-025: ''
  mensaje-026: El arma no es necesaria para activar la habilidad de 4 piezas. Los bonos de MMOItems se leen del servidor al
    abrir esta guía.
  mensaje-027: ''
  mensaje-028: Equipa las cuatro piezas del mismo conjunto en sus ranuras.
  mensaje-029: Acierta {v-e-hits-required-4} golpes cuerpo a cuerpo a enemigos. Máximo {valor2} entre golpes.
  mensaje-030: Dos capullos florecen. Lanza {valor1} latigazos de {v-e-lash-damage-3} HP y Lentitud I por {valor3}.
  mensaje-031: 'Alcance: {v-e-lash-range-7} bloques. Busca otro enemigo cercano si pierde su objetivo.'
  mensaje-032: 'Primer latigazo: {valor1}; intervalo {valor2}.'
  mensaje-033: Al recibir daño hostil, invoca {valor1} calaveras orbitales.
  mensaje-034: Cada una dispara hasta {v-e-shots-per-skull-3} veces; {v-e-damage-per-shot-5} HP de daño directo por impacto.
  mensaje-035: 'Alcance: {v-e-range-8} bloques. Un disparo global cada {valor2}.'
  mensaje-036: Atacan enemigos cercanos. No atacan jugadores ni mascotas.
  mensaje-037: Gana {v-e-fury-on-hit-12} de furia al golpear y {v-e-fury-on-damage-6} al recibir daño hostil.
  mensaje-038: Con {furia} de furia, pulsa Shift dos veces en {valor1}.
  mensaje-039: 'Golpes seguidos al mismo enemigo: +{valor1} de daño por combo, hasta {valor2}%.'
  mensaje-040: Cambiar de enemigo o pasar {valor1} entre golpes rompe el combo.
  mensaje-041: La furia empieza a decaer tras {valor1} sin combate.
  mensaje-042: Pulsa Shift dos veces en {valor1}.
  mensaje-043: +{valor1} daño cuerpo a cuerpo y +{pct-e-speed-bonus-20} velocidad; recibes {valor3} más de daño.
  mensaje-044: Cada golpe añade {valor1}, hasta {valor2} s desde la activación.
  mensaje-045: Recibe daño hostil o acierta {valor1} golpes cuerpo a cuerpo, con máximo {valor2} entre ambos.
  mensaje-046: 'Bendición: +{valor1} daño cuerpo a cuerpo, {valor2} menos daño recibido y +{pct-e-speed-bonus-06} velocidad.'
  mensaje-047: Cura {v-e-heal-on-activation-4} HP sin superar tu máximo.
  mensaje-048: Daño y reducción se suman a los pasivos de 4 piezas. Aparece un dragón dorado.
  mensaje-049: ''
  mensaje-050: 'Duración: {valor1} s.'
  mensaje-051: 'Recarga: {valor1} s desde activación.'
  mensaje-052: 1 HP = medio corazón. Daño base antes de defensas.
  mensaje-053: Quitar una pieza cancela el efecto. La recarga continúa mientras el servidor siga encendido.
  mensaje-054: ''
