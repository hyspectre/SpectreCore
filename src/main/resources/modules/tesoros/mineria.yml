tesoros:
  tipo: MATERIAL
  id: PALADIO
  cantidad-minima: 2
  cantidad-maxima: 8
# Mitrilo es un hallazgo independiente de Paladio, solo de menas avanzadas.
# La clasificación T2/T3 se toma de tesoros/config.yml. El contrato minero
# Experimentado o Profesional habilita la búsqueda; sin crear bloques nuevos.
mitrilo:
  tipo: MATERIAL
  id: MITRILO
  cantidad-minima: 1
  cantidad-maxima: 2
  rango-minimo: 2
  # Multiplicador de probabilidad solo al usar herramientas MMOItems reales.
  herramientas:
    tipo: TOOL
    bonificaciones:
      PICO_MITRILO: 1.25
      PICO_MITRILO_TEMPLADO: 1.60
  probabilidades:
    tier2: 1.0
    tier3: 2.0
# Resonancia independiente en los PDC de cada objeto; el Pico Perdido
# conserva su propio sistema anterior y no comparte energía con Mitrilo.
herramientas-mitrilo:
  # Resonancia amplificada: cristales visibles y golpeables sin modificar el mundo.
  # Cada cristal consumido entrega una única gema a su invocador.
  pico-amatista:
    activacion: 75
    recarga-segundos: 120
    duracion-segundos: 30
    bloques: 5
    minimo-bloques: 3
    max-sesiones: 8
    golpes: 3
    intervalo-golpe-ms: 300
    calidad: {basica: 75, intermedia: 22, superior: 3}
    gemas:
      basica: GEMA_AMATISTA_BASICA
      intermedia: GEMA_AMATISTA_INTERMEDIA
      superior: GEMA_AMATISTA_SUPERIOR
  resonancia:
    maxima: 100
    por-mineral-natural: 4
  cristal:
    recupera: 50
  carga:
    recupera: 30
  pico:
    activacion: 25
    duracion-segundos: 15
    radio: 5
    max-resaltados: 8
    resaltado-segundos: 5
    max-bloques-adicionales: 3
    coste-bloque-adicional: 5
    recarga-segundos: 20
  brujula:
    activacion: 30
    radio-horizontal: 16
    radio-vertical: 12
    duracion-senal-segundos: 8
    recarga-segundos: 35
  farol:
    anclar: 10
    ruta: 20
    marcas-segundos: 20
    recarga-segundos: 30
    distancia-maxima: 256
  barrena:
    activacion: 50
    pasos: 8
    intervalo-ticks: 5
    recarga-segundos: 45
    # Solo roca ordinaria. Ninguna mena, inventario, líquido o bloque especial.
    bloques: [STONE, DEEPSLATE, ANDESITE, DIORITE, GRANITE, TUFF, CALCITE,
      BLACKSTONE, BASALT, NETHERRACK, END_STONE]
# Taladro inicial y dos mejoras: exclusivamente roca ordinaria, jamás menas.
# Barrena de Mitrilo sigue siendo la herramienta avanzada para túneles.
taladro:
  tipos: [TALADRO, TALADRO_REFORZADO, TALADRO_CALIBRADO]
  bloques: [STONE, DEEPSLATE, ANDESITE, DIORITE, GRANITE, TUFF, CALCITE]
  intervalo-milisegundos: {nivel1: 500, nivel2: 350, nivel3: 250}
  extras: {nivel1: 0, nivel2: 1, nivel3: 3}

# La Suerte de AuraSkills incrementa probabilidades relativas y otorga como
# máximo una unidad adicional, sin multiplicar drops de Minecraft ni XP.
suerte:
  hallazgos:
    incremento-relativo-por-punto: 1.5
    multiplicador-maximo: 2.0
  encuentros:
    incremento-relativo-por-punto: 1.5
    multiplicador-maximo: 2.0
  botin:
    incremento-relativo-por-punto: 1.0
    multiplicador-maximo: 1.8
  cantidad-paladio:
    por-punto: 1.0
    maximo-porcentaje: 35.0
  cantidad-mitrilo:
    por-punto: 0.8
    maximo-porcentaje: 25.0
  calidad-gemas:
    puntos-por-luck: 0.05
    maximo-puntos: 5.0

# Los mobs son MythicMobs Free; el encuentro y botín los gestiona SpectreCore.
# Ningún mob aparece por bloques colocados ni minados automáticamente.
encuentros:
  max-activos: 12
  duende:
    mob: HYDEV_DUENDE_MINERO
    menas: [GOLD_ORE, DEEPSLATE_GOLD_ORE]
    probabilidad: 3.5
    recarga-segundos: 70
    botin:
      chatarra: {tipo: MATERIAL, id: CHATARRA_MECANICA, nombre: "Chatarra Mecánica", probabilidad: 85.0, minimo: 1, maximo: 3}
  prospector:
    mob: HYDEV_PROSPECTOR_ANTIGUO
    menas: [DIAMOND_ORE, DEEPSLATE_DIAMOND_ORE, EMERALD_ORE, DEEPSLATE_EMERALD_ORE, OBSIDIAN]
    probabilidad: 2.2
    recarga-segundos: 150
    botin:
      chatarra: {tipo: MATERIAL, id: CHATARRA_ANTIGUA, nombre: "Chatarra Antigua", probabilidad: 70.0, minimo: 1, maximo: 2}
      paladio: {tipo: MATERIAL, id: PALADIO, nombre: "Paladio", probabilidad: 55.0, minimo: 2, maximo: 4}
      fragmento: {tipo: MATERIAL, id: FRAGMENTO_PICO_PERDIDO, nombre: "Fragmento del Pico Perdido", probabilidad: 65.0, minimo: 1, maximo: 1}

probabilidades:
  mineria: {tier1: 0.65, tier2: 0.90, tier3: 1.40}
visuales:
  activados: true
  max-animaciones: 32
