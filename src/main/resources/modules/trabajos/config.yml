# Nombres mostrados al jugador; los IDs internos no cambian.
presentacion:
  trabajos:
    minero: "Minería"
    granjero: "Agricultura"
    cazador: "Caza"
  rangos:
    novato: "Novato"
    experimentado: "Experimentado"
    profesional: "Profesional"

# Recompensas por actividad para los tres oficios de Hydev.
# Los contratos adquieren permisos persistentes de LuckPerms. Todos los valores
# (rangos, monedas y segundos) se usan también en la GUI nativa.
cooldowns:
  minero:
    novato: 10
    experimentado: 7
    profesional: 4
  granjero:
    novato: 8
    experimentado: 5
    profesional: 3
  cazador:
    novato: 12
    experimentado: 8
    profesional: 5

minero:
  novato:
    dinero: {minimo: 1, maximo: 4}
  experimentado:
    dinero: {minimo: 4, maximo: 6}
  profesional:
    dinero: {minimo: 8, maximo: 12}
granjero:
  novato:
    dinero: {minimo: 1, maximo: 3}
  experimentado:
    dinero: {minimo: 3, maximo: 6}
  profesional:
    dinero: {minimo: 6, maximo: 10}
cazador:
  novato:
    dinero: {minimo: 2, maximo: 6}
  experimentado:
    dinero: {minimo: 6, maximo: 12}
  profesional:
    dinero: {minimo: 12, maximo: 24}

# Encargo repetible del herrero: el jugador decide entre entregar Mitrilo
# para obtener monedas o reservarlo para fabricar sus herramientas.
# No genera monedas adicionales por cada bloque minado.
encargos:
  mitrilo:
    tipo: MATERIAL
    id: MITRILO
    cantidad: 4
    recompensa: 180
    rango-minimo: 2

# Precios extraídos de los tres menús originales de zMenu.
contratos:
  precios:
    novato: 50
    experimentado: 1500
    profesional: 3500

economia:
  permitir-comando-eco: true

avisos:
  intervalo-cooldown-milisegundos: 5000

# Taller nativo de Mineralurgia. Los minerales hechizados son los IDs
# MATERIAL existentes del servidor; nunca se generan variantes paralelas.
# Pagos fijos para que el jugador conozca el resultado ANTES de confirmar.
taller-minero:
  nivel-minimo: 3
  compactar-unidades: 64
  max-operaciones: 8
  recetas:
    cobre: {nombre: "Cobre", origen: COPPER_INGOT, resultado-id: COBRE, pago: 12}
    hierro: {nombre: "Hierro", origen: IRON_INGOT, resultado-id: HIERRO, pago: 30}
    oro: {nombre: "Oro", origen: GOLD_INGOT, resultado-id: ORO, pago: 55}
    lapis: {nombre: "Lapislázuli", origen: LAPIS_LAZULI, resultado-id: LAPIS, pago: 40}
    redstone: {nombre: "Redstone", origen: REDSTONE, resultado-id: REDSTONE, pago: 35}
    diamante: {nombre: "Diamante", origen: DIAMOND, resultado-id: DIAMANTE, pago: 135}
