gemas:
  identificar-por: id
  nombre: Pico Perdido
  pico: PICO_GEMAS
  tipo-pico: TOOL
  carga-maxima: 50
  ventana-segundos: 30
  ids:
    basica: GEMA_PERDIDA_BASICA
    intermedia: GEMA_PERDIDA_INTERMEDIA
    superior: GEMA_PERDIDA_SUPERIOR
visuales:
  activados: true
  max-animaciones: 32

# Regla de carga y distribución de calidad. Cada tier suma 100.
reglas:
  carga-por-tier: {tier1: 1, tier2: 2, tier3: 4}
  calidad:
    tier1: {basica: 100.0, intermedia: 0.0, superior: 0.0}
    tier2: {basica: 75.0, intermedia: 25.0, superior: 0.0}
    tier3: {basica: 50.0, intermedia: 40.0, superior: 10.0}
