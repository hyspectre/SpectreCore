gemas:
  identificar-por: id
  nombre: Pico Perdido
  pico: PICO_GEMAS
  tipo-pico: TOOL
  carga-maxima: 50
  ventana-segundos: 30
  ids:
    basica: [GEMA_RUBI_1, GEMA_ONICE_1, GEMA_AMATISTA_1]
    intermedia: [GEMA_RUBI_2, GEMA_ONICE_2, GEMA_AMATISTA_2]
    superior: [GEMA_RUBI_3, GEMA_ONICE_3, GEMA_AMATISTA_3]
visuales:
  activados: true
  max-animaciones: 32

# Regla de carga y distribución de calidad. Cada tier suma 100.
reglas:
  carga-por-tier: {tier1: 1, tier2: 2, tier3: 4}
  calidad:
    tier1: {basica: 100.0, intermedia: 0.0, superior: 0.0}
    tier2: {basica: 75.0, intermedia: 25.0, superior: 0.0}
    tier3: {basica: 50.0, intermedia: 40.0, superior: 10.0}
