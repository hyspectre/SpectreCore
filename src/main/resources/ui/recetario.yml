# Recetario independiente. No muestra comandos ni nombres técnicos al jugador.
enabled: true
catalogo:
  # False: todos pueden consultar los ingredientes; se conserva el progreso de descubrimiento.
  ocultar-desconocidas: false
  titulo: "<dark_gray>⧇ <gold>Cocina <dark_gray>│ <white>Recetario"
  espacios: 54
  posiciones: [11, 12, 13, 14, 15, 20, 21, 22, 23, 24, 29, 30, 31, 32, 33]
  resumen-slot: 4
  anterior-slot: 45
  siguiente-slot: 53
  cerrar-slot: 49
  conocido:
    nombre: "<white>⧇ <gold><bold>{nombre}"
    lore:
      - ""
      - "<gray>Tipo: <white>{uso}"
      - "<gray>Ingredientes: <yellow>Grado {nivel-ingredientes}/5"
      - "<gray>Efecto: <white>{efecto}"
      - ""
      - "<green>✦ Descubierta"
      - "<#FFCC55>► Clic para consultar"
  pendiente:
    nombre: "<white>⧇ <gold><bold>{nombre}"
    lore:
      - ""
      - "<gray>Tipo: <white>{uso}"
      - "<gray>Ingredientes: <yellow>Grado {nivel-ingredientes}/5"
      - "<gray>Efecto: <white>{efecto}"
      - ""
      - "<yellow>✦ Pendiente de preparar"
      - "<#FFCC55>► Clic para consultar"
  desconocido:
    nombre: "<gray>⧇ <dark_gray>Preparación desconocida"
    lore:
      - ""
      - "<gray>Pista: <white>{pista}"
      - "<gray>Resta descubrir esta preparación."
      - ""
      - "<#FFCC55>► Clic para investigar"
  resumen:
    nombre: "<gold>✦ Archivo de recetas"
    lore:
      - ""
      - "<gray>Descubiertas: <yellow>{descubiertas}<gray>/<white>{total}"
      - "<gray>Mostrando: <white>{pagina}<gray>/<white>{paginas}"
      - ""
      - "<gray>Prepara y sirve platos nuevos"
      - "<gray>para descubrir todos sus secretos."
detalle:
  titulo: "<dark_gray>⧇ <gold>Cocina <dark_gray>│ <white>{nombre}"
  espacios: 54
  cabecera-slot: 4
  ingrediente-slots: [20, 22, 24]
  preparacion-slot: 30
  resultado-slot: 32
  volver-slot: 48
  cerrar-slot: 50
  cabecera:
    nombre: "<gold>✦ {nombre}"
    lore:
      - ""
      - "<gray>Especialidad: <white>{uso}"
      - "<gray>Esfuerzo: <yellow>Grado {nivel-ingredientes}/5"
      - "<gray>{pista}"
  ingrediente:
    nombre: "<white>{nombre-ingrediente}"
    lore:
      - "<gray>Ingrediente <yellow>{indice}<gray>/3"
      - "<gray>Por ración: <white>1 unidad"
  preparacion:
    nombre: "<gold>♨ Preparación"
    lore:
      - ""
      - "<gray>Revolver: <yellow>{revolver} s"
      - "<gray>Servir: <green>{servir} s"
      - "<gray>Raciones: <white>1–3 según el agua"
      - ""
      - "<gray>La precisión mejora la calidad."
  resultado:
    nombre: "<gold>✦ Beneficio"
    lore:
      - ""
      - "<gray>Efecto: <white>{efecto}"
      - "<gray>Los ingredientes raros conceden"
      - "<gray>beneficios más intensos."
      - ""
      - "<green>Exquisito: <white>mejor resultado"
  desconocido:
    nombre: "<gray>✦ Preparación aún desconocida"
    lore:
      - ""
      - "<gray>{pista}"
      - "<gray>Prueba combinaciones para descubrirla."
navegacion:
  anterior-nombre: "<white>⇜ <gold>Página anterior"
  siguiente-nombre: "<white>► <gold>Página siguiente"
  volver-nombre: "<white>⇜ <gold>Volver al recetario"
  cerrar-nombre: "<white>⇜ <gray>Cerrar"
  lore:
    - "<gray>Continuar explorando las preparaciones."
