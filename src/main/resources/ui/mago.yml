# New Magomenu UI configuration - simplified & editable
# Replace old ui/mago.yml with this; supports both new "sections:" format and old "pages:" for backwards compatibility

mago:
  title: "&7§lEl Mago"
  # Icons use Minecraft material names - NO Base64 required!
  # If missing, plugin generates default icons automatically
  icons:
    portada: "BOOK"
    volver: "ARROW"
    cerrar: "BARRIERA"
  
  # Navigation sections - FREE-FORM, no rigid page IDs
  # Add as many as you want without touching Java!
  sections:
    inicio:
      title: "&6El Mago"
      lore: "Bienvenido a la biblioteca Hydev"
      items:
        - material: "DIAMOND_SWORD"
          label: "&6Combate"
          target: "combate"
        - material: "EMERALD"
          label: "&6Profesiones"
          target: "profesiones"
        - material: "NETHER_STAR"
          label: "&6Tesoros"
          target: "tesoros"
    combate:
      title: "&6Combate"
      lore: "Conjuntos y habilidades"
      items:
        - material: "DIAMOND_SWORD"
          label: "&6Armaduras"
          target: "armaduras"
        - material: "BOOK"
          label: "&6Habilidades"
          target: "habilidades"
    profesiones:
      title: "&6Profesiones"
      lore: "Minería, Agricultura y Coba"
      items:
        - material: "IRON_PICKAXE"
          label: "&6Mineria"
          target: "mineria"
        - material: "WHEAT"
          label: "&6Agricultura"
          target: "agricultura"
    tesoros:
      title: "&6Tesoros"
      lore: "Obtén recompensas por minería y caza"
      items:
        - material: "GOLD_INGOT"
          label: "&6Mineria"
          target: "mineria_tesoros"
        - material: "COOKED_BEEF"
          label: "&6Caza"
          target: "caza_tesoros"
    # Add more sections anytime! No Java changes needed.
  
  # Optional global messages
  messages:
    invalid_page: "&c§lPágina inválida"
    closing: "&7§lHasta luego!"
